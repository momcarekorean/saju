# 일본 인기용품 가격·재고를 매일 아침 한국시간 9시 05분·9시 35분·10시 05분, 하루 3번 읽어 jp_prices.json 으로 저장한다.
# 읽는 데 약 7분 걸린다. 깃허브 예약 실행은 늦게 돌거나(실험에서 10~20분) 가끔 통째로 빠지기도 해서(2026-10-21 09:30 한 번 빠짐)
# 한 번이 빠져도 다른 시각이 채우도록 세 번 걸어 둔다. 하루 3번 중 하나만 돌아도 그날 값이 갱신된다.
# 일본 쇼핑몰 접속이 막히거나 자동 확인된 품목이 6개 미만이면 파일을 바꾸지 않고 실패로 끝난다(이전 값 유지).
name: jp-prices
on:
  schedule:
    - cron: "5 0 * * *"    # UTC 00:05 = 한국시간 09:05
    - cron: "35 0 * * *"   # UTC 00:35 = 한국시간 09:35
    - cron: "5 1 * * *"    # UTC 01:05 = 한국시간 10:05
  workflow_dispatch: {}
  push:
    paths:
      - "jp/**"
      - ".github/workflows/jp-prices.yml"
permissions:
  contents: write
concurrency:
  group: jp-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 가격·재고 수집
        run: python jp/jp_fetch.py --out jp_prices.json --min-ok 6
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "jp-prices-bot"
          git config user.email "jp-prices-bot@users.noreply.github.com"
          git add jp_prices.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "일본 가격 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
